<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>记账表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:if="${record.id == null}">新增记账</h2>
    <h2 th:if="${record.id != null}">编辑记账</h2>
    <form th:action="@{/records/save}" method="post">
        <input type="hidden" name="id" th:value="${record.id}">
        <div class="mb-3">
            <label>类型</label>
            <select name="type" class="form-control">
                <option value="expense" th:selected="${record.type == 'expense'}">支出</option>
                <option value="income" th:selected="${record.type == 'income'}">收入</option>
            </select>
        </div>
        <div class="mb-3">
            <label>金额</label>
            <input type="number" step="0.01" name="amount" th:value="${record.amount}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>分类</label>
            <input type="text" name="category" th:value="${record.category}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>日期</label>
            <input type="date" name="date" th:value="${record.date}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>备注</label>
            <textarea name="note" class="form-control" th:text="${record.note}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/records" class="btn btn-secondary">返回</a>
    </form>
</div>
</body>
</html>
